name: Run Tests

on:
  push:
  pull_request:

jobs:
  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --all --locked --exclude asic-rs-pydantic --exclude asic-rs-pydantic-macros --exclude pyasic-rs --exclude asic-rs-ffi

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Python environment
        run: python -m venv .venv

      - name: Install maturin
        run: .venv/bin/python -m pip install --upgrade pip maturin

      - name: Build and install package with test dependencies
        run: VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" "$GITHUB_WORKSPACE/.venv/bin/maturin" develop --features python --extras test

      - name: Run Python tests
        run: .venv/bin/python -m pytest python/pyasic-rs/tests

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Validate the packaged workspace and lockfile
        run: |
          mkdir "$RUNNER_TEMP/pyasic-sdist" "$RUNNER_TEMP/cargo-offline"
          tar -xzf dist/pyasic_rs-*.tar.gz -C "$RUNNER_TEMP/pyasic-sdist" --strip-components=1
          cmp Cargo.toml "$RUNNER_TEMP/pyasic-sdist/Cargo.toml"
          cmp Cargo.lock "$RUNNER_TEMP/pyasic-sdist/Cargo.lock"
          cd "$RUNNER_TEMP/pyasic-sdist"
          mkdir -p .cargo
          cargo vendor --manifest-path Cargo.toml --locked VENDOR > .cargo/config.toml
          CARGO_HOME="$RUNNER_TEMP/cargo-offline" cargo metadata --locked --offline --format-version 1 > /dev/null

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go/go.mod

      - name: Build FFI bridge
        run: make -C go ffi

      - name: Run FFI crate tests
        run: cargo test -p asic-rs-ffi --locked -- --test-threads=1

      - name: Run Go tests
        working-directory: go
        env:
          CGO_ENABLED: "1"
        run: go test ./asic_go/ -count=1
