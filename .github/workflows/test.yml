name: Run Tests

on:
  push:
  pull_request:

jobs:
  cargo-test:
    name: Cargo Test
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --all --locked --exclude asic-rs-pydantic --exclude asic-rs-pydantic-macros --exclude asic-rs-ffi

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create Python environment
        run: python -m venv .venv

      - name: Install maturin
        run: .venv/bin/python -m pip install --upgrade pip maturin

      - name: Build and install package with test dependencies
        run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --features python --extras test

      - name: Run Python tests
        run: .venv/bin/python -m pytest python/tests

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go/go.mod

      - name: Build FFI bridge
        run: make -C go ffi

      - name: Run FFI crate tests
        run: cargo test -p asic-rs-ffi --locked -- --test-threads=1

      - name: Run Go tests
        working-directory: go
        env:
          CGO_ENABLED: "1"
        run: go test ./asicrs/ -count=1
