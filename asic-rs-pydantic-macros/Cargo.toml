[package]
name = "asic-rs-pydantic-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
keywords.workspace = true
description = "Pydantic proc macros for asic-rs."

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
# Omit the version so Cargo excludes this test-only dependency when publishing.
# The library depends on these macros and must be published after them.
asic-rs-pydantic = { path = "../asic-rs-pydantic" }
pyo3.workspace = true
trybuild = "1.0"
